<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f2eb" />
    <title>마음 옷장</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- hand-drawn wobble for pencil outlines -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app">
      <div class="track" id="track">
        <section id="wardrobe" class="scene scene-wardrobe" aria-label="옷장"></section>
        <section id="editor" class="scene scene-editor" aria-label="마음 적기"></section>
      </div>
    </div>
    <div id="flight" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <p class="demo-badge" aria-hidden="true">샘플 옷장 · 내 기록과 분리되어 있어요</p>
    <div class="grain" aria-hidden="true"></div>

    <script src="lib/p5.min.js"></script>
    <script src="js/util.js"></script>
    <script src="js/garments.js"></script>
    <script src="js/store.js"></script>
    <script src="js/texture.js"></script>
    <script src="js/wardrobe.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
